<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="chev1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chev2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded dark tile -->
  <rect x="4" y="4" width="452" height="142" rx="30" fill="url(#tile)"/>
  <rect x="4" y="4" width="452" height="142" rx="30" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="450.5" height="140.5" rx="29.25" fill="none" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- chevron mark: big gradient chevron + offset light chevron + teal accent -->
  <path d="M96 28 L52 75 L96 122 L96 96 L76 75 L96 54 Z" fill="url(#chev1)"/>
  <path d="M116 40 L84 75 L116 110 L116 88 L106 75 L116 62 Z" fill="url(#chev2)" opacity="0.92"/>
  <path d="M126 46 L100 75 L126 104" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="150" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="2">BD BBC</text>
  <text x="152" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#2dd4bf" letter-spacing="11">SOFTWARE</text>
</svg>
