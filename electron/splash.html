<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative glow blobs */
    .card::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(16,185,129,0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
    }

    .logo-icon svg { width: 30px; height: 30px; fill: white; }

    .logo-text h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .logo-text p {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .status {
      font-size: 13px;
      color: #94a3b8;
      z-index: 1;
      letter-spacing: 0.3px;
    }

    /* Animated progress bar */
    .progress-track {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      z-index: 1;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #10b981);
      background-size: 200% 100%;
      border-radius: 99px;
      animation: shimmer 1.8s ease-in-out infinite;
      width: 60%;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; width: 20%; }
      50%  { background-position: 0% center;   width: 80%; }
      100% { background-position: 200% center; width: 20%; }
    }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 10px;
      color: #334155;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">
        <!-- Shopping bag / POS icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/>
          <path d="M16 10a4 4 0 01-8 0" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>Unique POS</h1>
        <p>Shop Management System</p>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <p class="status" id="status">Starting services…</p>

    <p class="version">v1.0.0 &nbsp;|&nbsp; Powered by Bdbbc.com</p>
  </div>

  <script>
    const messages = [
      'Starting services…',
      'Connecting to database…',
      'Loading POS modules…',
      'Almost ready…',
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      el.textContent = messages[i];
    }, 2200);
  </script>
</body>
</html>
