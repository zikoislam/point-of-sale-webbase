<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Unique POS — License Activation</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
      font-family: "Segoe UI", "Nirmala UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      -webkit-user-select: none;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 30px 32px 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

    .logo {
      width: 42px; height: 42px; flex: none;
      display: grid; place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      font-size: 20px; font-weight: 700; color: #fff;
    }

    .brand h1 { margin: 0; font-size: 17px; font-weight: 600; color: #f8fafc; }
    .brand p { margin: 2px 0 0; font-size: 11.5px; color: #94a3b8; }

    .state {
      display: flex; gap: 10px; align-items: flex-start;
      border-radius: 12px; padding: 13px 15px; margin-bottom: 22px;
      font-size: 12.5px; line-height: 1.6;
    }
    .state.expired { background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; }
    .state.none    { background: rgba(234, 179, 8, 0.10);  border: 1px solid rgba(234, 179, 8, 0.32);  color: #fde68a; }
    .state.ok      { background: rgba(34, 197, 94, 0.10);  border: 1px solid rgba(34, 197, 94, 0.32);  color: #86efac; }
    .state strong { color: #f8fafc; }

    label { display: block; font-size: 12.5px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }

    textarea {
      width: 100%; min-height: 104px; resize: vertical;
      background: #0b1220; border: 1px solid #334155; border-radius: 12px;
      padding: 12px 14px; color: #e2e8f0;
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 11.5px;
      line-height: 1.55; letter-spacing: 0.2px;
      -webkit-user-select: text; user-select: text;
      outline: none;
    }
    textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18); }

    .machine {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #0b1220; border: 1px solid #1e293b; border-radius: 12px;
      padding: 11px 14px; margin-top: 16px;
    }
    .machine .meta { font-size: 11px; color: #94a3b8; line-height: 1.55; }
    .machine .id {
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 15px;
      letter-spacing: 1.4px; color: #a5b4fc; -webkit-user-select: text; user-select: text;
    }

    .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; }

    button {
      font-family: inherit; font-size: 13px; font-weight: 600;
      border-radius: 11px; padding: 11px 20px; cursor: pointer;
      border: 1px solid transparent; transition: background 0.15s, border-color 0.15s;
    }
    button:disabled { opacity: 0.55; cursor: default; }

    .primary { background: #4f46e5; color: #fff; flex: 1; }
    .primary:not(:disabled):hover { background: #4338ca; }

    .ghost { background: #1e293b; color: #cbd5e1; border-color: #334155; }
    .ghost:not(:disabled):hover { background: #293548; }

    .error {
      margin-top: 14px; padding: 11px 14px; border-radius: 11px; font-size: 12.5px; line-height: 1.6;
      background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5;
      display: none;
    }
    .error.show { display: block; }

    footer {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid #1e293b;
      font-size: 11.5px; color: #64748b; line-height: 1.7;
    }
    footer b { color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">U</div>
      <div>
        <h1>Unique POS</h1>
        <p>লাইসেন্স অ্যাক্টিভেশন · <span id="version">—</span></p>
      </div>
    </div>

    <div class="state none" id="state">
      <div id="stateText">লাইসেন্স চেক করা হচ্ছে…</div>
    </div>

    <label for="key">লাইসেন্স কী (License Key)</label>
    <textarea id="key" spellcheck="false" autocomplete="off"
      placeholder="POS1.…………  — এখানে কী-টি পেস্ট করুন"></textarea>

    <div class="machine">
      <div class="meta">
        এই কম্পিউটারের Machine ID<br />
        <span style="color:#64748b">কী বানাতে এই নম্বরটি পাঠান</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px">
        <div class="id" id="machineId">…………</div>
        <button class="ghost" id="copy" style="padding:7px 13px; font-size:11.5px">কপি</button>
      </div>
    </div>

    <div class="error" id="error"></div>

    <div class="actions">
      <button class="primary" id="activate">অ্যাক্টিভেট করুন</button>
      <button class="ghost" id="quit">বন্ধ করুন</button>
    </div>

    <footer>
      লাইসেন্স না থাকলে বা মেয়াদ শেষ হলে অ্যাপ খুলবে না।<br />
      নতুন কী-এর জন্য যোগাযোগ করুন — <b id="support"></b>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // Bengali wording for each way a key can be refused.
    const MESSAGES = {
      missing: 'এই কম্পিউটারে এখন কোনো লাইসেন্স নেই। কী পেস্ট করে অ্যাক্টিভেট করুন।',
      'not-configured': 'এই বিল্ডে লাইসেন্স পাবলিক কী বসানো নেই। ডেভেলপারের সাথে যোগাযোগ করুন।',
      malformed: 'কী-টি সঠিক ফরম্যাটে নেই। পুরো লাইনটি কপি করে পেস্ট করুন।',
      'bad-signature': 'এই কী Bdbbc.com থেকে ইস্যু করা হয়নি। কী-টি আবার দেখে নিন।',
      'wrong-machine': 'এই কী অন্য একটি কম্পিউটারের জন্য বানানো। আপনার Machine ID পাঠিয়ে নতুন কী নিন।',
      expired: 'আপনার লাইসেন্সের মেয়াদ শেষ হয়ে গেছে। নতুন কী ছাড়া অ্যাপ খুলবে না।',
    };

    let status = null;

    function render(state) {
      const box = $('state');
      box.className = 'state ' + state.tone;
      $('stateText').innerHTML = state.html;
    }

    function describe(lic) {
      if (lic.licensed) {
        return {
          tone: 'ok',
          html: `<strong>${lic.customer || 'লাইসেন্সকৃত'}</strong> — বৈধ` +
                (lic.expiresAt ? `, মেয়াদ ${lic.expiresAt} পর্যন্ত` : '') +
                (lic.serial ? ` (সিরিয়াল ${lic.serial})` : ''),
        };
      }

      if (lic.reason === 'expired' && lic.expiresAt) {
        return {
          tone: 'expired',
          html: `লাইসেন্সের মেয়াদ <strong>${lic.expiresAt}</strong> তারিখে শেষ হয়েছে। নতুন কী দিলে অ্যাপ আবার খুলবে।`,
        };
      }

      return { tone: 'none', html: MESSAGES[lic.reason] || 'লাইসেন্স প্রয়োজন।' };
    }

    function showError(text) {
      const box = $('error');
      if (!text) { box.className = 'error'; return; }
      box.textContent = text;
      box.className = 'error show';
    }

    function busy(on) {
      $('activate').disabled = on;
      $('activate').textContent = on ? 'যাচাই করা হচ্ছে…' : 'অ্যাক্টিভেট করুন';
    }

    async function activate() {
      const key = $('key').value.trim();
      if (!key) { showError('আগে লাইসেন্স কী-টি পেস্ট করুন।'); return; }

      busy(true);
      showError('');

      try {
        const result = await window.electronAPI.license.activate(key);

        if (result.success) {
          render({ tone: 'ok', html: 'লাইসেন্স গ্রহণ করা হয়েছে — অ্যাপ চালু হচ্ছে…' });
          return;
        }

        showError(MESSAGES[result.reason] || result.message || 'কী-টি গ্রহণ করা যায়নি।');
      } catch (err) {
        showError('কী যাচাই করা যায়নি: ' + (err && err.message ? err.message : err));
      } finally {
        busy(false);
      }
    }

    $('activate').addEventListener('click', activate);
    $('quit').addEventListener('click', () => window.electronAPI.quit());

    $('key').addEventListener('keydown', (event) => {
      // A pasted key plus Enter activates; newlines are never wanted inside a key.
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        activate();
      }
    });

    $('copy').addEventListener('click', async () => {
      if (!status) return;
      try {
        await navigator.clipboard.writeText(status.machineIdFormatted);
        $('copy').textContent = 'কপি হয়েছে';
        setTimeout(() => { $('copy').textContent = 'কপি'; }, 1400);
      } catch {
        // Clipboard can be blocked; the ID stays selectable by hand.
        showError('কপি করা যায়নি — নম্বরটি হাতে সিলেক্ট করে কপি করুন।');
      }
    });

    (async () => {
      status = await window.electronAPI.license.status();

      $('version').textContent = 'v' + status.appVersion;
      $('machineId').textContent = status.machineIdFormatted;
      $('support').textContent = status.supportCompany + ' — ' + status.supportPhone;

      render(describe(status));

      if (!status.licensed && $('key').value === '') $('key').focus();
    })();
  </script>
</body>
</html>
