<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>BDBBC License Manager</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #0f172a; color: #e2e8f0;
        font-family: 'Segoe UI', Nirmala UI, system-ui, sans-serif; font-size: 14px;
      }
      header { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid #1e293b; }
      header h1 { font-size: 16px; margin: 0; }
      header .sub { font-size: 12px; color: #94a3b8; }
      .wrap { padding: 18px 22px 40px; max-width: 980px; margin: 0 auto; }
      .banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; font-size: 12.5px; margin-bottom: 16px; }
      .banner.ok { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.35); color: #6ee7b7; }
      .banner.bad { background: rgba(244,63,94,.1); border: 1px solid rgba(244,63,94,.35); color: #fda4af; }
      .banner code { color: #cbd5e1; }
      .card { background: #111c31; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #94a3b8; margin-bottom: 5px; }
      input, select, textarea {
        width: 100%; padding: 9px 11px; background: #0b1220; border: 1px solid #263449;
        border-radius: 10px; color: #e2e8f0; font-size: 13px; font-family: inherit;
      }
      input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
      .chips { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
      .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid #263449; background: #0b1220; color: #cbd5e1; cursor: pointer; font-size: 12px; }
      .chip.on { background: #2563eb; border-color: #2563eb; color: #fff; }
      button.btn { padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
      button.primary { background: #2563eb; color: #fff; }
      button.primary:hover { background: #3b82f6; }
      button.ghost { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
      button.ghost:hover { background: #263449; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .row { display: flex; gap: 10px; align-items: center; }
      .result { margin-top: 6px; }
      .result .keybox { display: flex; gap: 8px; }
      .result textarea { height: 92px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
      .meta { font-size: 12px; color: #94a3b8; margin: 4px 0 10px; }
      .err { color: #fda4af; font-size: 12.5px; margin-top: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
      th { color: #94a3b8; text-transform: uppercase; font-size: 10.5px; letter-spacing: .4px; }
      td.key { max-width: 220px; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; color: #93c5fd; cursor: copy; }
      h2 { font-size: 13px; margin: 0 0 12px; color: #cbd5e1; }
      .muted { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>BDBBC License Manager</h1>
        <div class="sub">Issue offline shop license keys (Ed25519)</div>
      </div>
    </header>

    <div class="wrap">
      <div id="banner" class="banner bad">Checking signing key…</div>

      <div class="card">
        <h2>New license</h2>
        <div class="grid">
          <div>
            <label>Shop / customer name *</label>
            <input id="shop" placeholder="e.g. Rahim Store" />
          </div>
          <div>
            <label>Machine ID (optional — blank = any PC)</label>
            <input id="machine" placeholder="ABCD-EF12-3456" />
          </div>
        </div>

        <div style="margin-top:12px">
          <label>Valid period</label>
          <div class="chips" id="monthChips">
            <span class="chip" data-m="1">1 month</span>
            <span class="chip" data-m="3">3 months</span>
            <span class="chip on" data-m="12">12 months</span>
            <span class="chip" data-m="6">6 months</span>
          </div>
          <div class="grid">
            <div>
              <label>Months (or use a chip)</label>
              <input id="months" type="number" min="1" value="12" />
            </div>
            <div>
              <label>Grace days after expiry</label>
              <input id="grace" type="number" min="0" value="7" />
            </div>
          </div>
          <div style="margin-top:8px">
            <label>Or a fixed expiry date (optional — overrides months)</label>
            <input id="expires" type="date" />
          </div>
        </div>

        <div class="row" style="margin-top:14px">
          <button id="issue" class="btn primary">Generate license key</button>
          <span class="muted">The key is saved to shops/&lt;name&gt;/license.key and issued.csv</span>
        </div>
        <div id="error" class="err"></div>

        <div id="result" class="result" style="display:none">
          <div class="meta" id="resultMeta"></div>
          <div class="keybox">
            <textarea id="keyOut" readonly></textarea>
            <div style="display:flex; flex-direction:column; gap:8px">
              <button id="copy" class="btn ghost">Copy</button>
              <button id="save" class="btn ghost">Save…</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Issued keys <span class="muted" id="issuedCount"></span></h2>
        <div style="max-height: 280px; overflow:auto">
          <table>
            <thead>
              <tr><th>Serial</th><th>Shop</th><th>Expires</th><th>Months</th><th>Machine</th><th>Key</th></tr>
            </thead>
            <tbody id="issuedBody">
              <tr><td colspan="6" class="muted">No keys issued yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
