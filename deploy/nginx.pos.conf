# Nginx reverse proxy for a self-hosted BDBBC POS.
# Copy to /etc/nginx/sites-available/pos and symlink into sites-enabled.
#
#   pos-api listens on 127.0.0.1:5000  (PM2 app "pos-api")
#   pos-web listens on 127.0.0.1:3000  (PM2 app "pos-web", Next standalone)
#
# HTTPS: run `certbot --nginx -d your-domain.com` and it fills in the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Large uploads / exports
    client_max_body_size 25m;

    # Socket.io needs the upgrade headers
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded logos / avatars
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
